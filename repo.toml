# bitty-agent: workspace identity descriptor (kind/lang/role mirror workspace.toml).
[repo]
name = "bitty-agent"
kind = "extension"
lang = "rust"
role = "L1 Rust Core Extension: AI agent protocol layer (api + impl), default-off"
owner = "bitty-ai"
docs = "bitty-ai-docs"

[contracts.provides]
agent-api = "crates/bitty-agent-api" # light contract: AgentId/AgentMessage/ToolCall/bounded queues, zero impl deps
agent-impl = "crates/bitty-agent" # agent runtime: session management/tool dispatch/observation handling

[contracts.consumes]
core-ontology = "bitty-docs: ADR-0013" # Agent identity terms reused in capability audit records
ai-architecture = "bitty-ai-docs: AI is independent sub-platform" # Extracted per small-core principle
